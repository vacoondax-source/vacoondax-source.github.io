<!DOCTYPE html>
<html>

<head>
<title>Expense Tracker</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:20px;
max-width:400px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:90%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
background:#2d4db7;
color:white;
border:none;
cursor:pointer;
}

.balance{
font-size:24px;
margin:20px;
}

.list{
text-align:left;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Expense Tracker</h2>

<div class="balance">
Balance: $<span id="balance">0</span>
</div>

<input id="text" placeholder="Description">

<input id="amount" placeholder="Amount (use - for expense)">

<br>

<button onclick="addTransaction()">Add</button>

<div class="list" id="list"></div>

</div>

<script>

let balance = 0;

function addTransaction(){

let text = document.getElementById("text").value;
let amount = Number(document.getElementById("amount").value);

balance += amount;

document.getElementById("balance").innerText = balance;

let item = document.createElement("p");

item.innerText = text + " : $" + amount;

document.getElementById("list").appendChild(item);

}

</script>

</body>

</html>
